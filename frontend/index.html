<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТехноЛотос - Понтоны и лодки</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Шапка -->
    <header class="header">
        <div class="container">
            <h1>ТехноЛотос</h1>
            <p>Производство понтонов и лодок из ПНД</p>
        </div>
    </header>

    <!-- Герой-секция -->
    <section class="hero">
        <div class="container">
            <h2>Качественные понтоны для вашего бизнеса</h2>
            <p>Прочные, долговечные и безопасные решения для воды</p>
            <button class="cta-button" onclick="scrollToProducts()">Смотреть наши продукты</button>
        </div>
    </section>

    <!-- Каталог продуктов -->
    <section id="products" class="products">
        <div class="container">
            <h2>Наша продукция</h2>
            <div id="productsList" class="products-grid">
                <!-- Продукты загружаются через JavaScript -->
                <div class="loading">Загрузка продуктов...</div>
            </div>
        </div>
    </section>

    <!-- Модальное окно заказа -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeOrderModal()">&times;</span>
            <h3>Оставить заявку</h3>
            <form id="orderForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>Ваше имя:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Телефон:</label>
                    <input type="tel" id="phone" required placeholder="+7 (999) 123-45-67">
                </div>
                <div class="form-group">
                    <label>Email (необязательно):</label>
                    <input type="email" id="email">
                </div>
                <div class="form-group">
                    <label>Комментарий:</label>
                    <textarea id="description" placeholder="Дополнительная информация..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Отправить заявку</button>
            </form>
        </div>
    </div>

    <!-- Уведомления -->
    <div id="notification" class="notification"></div>

    <script src="js/app.js"></script>
</body>
</html>
