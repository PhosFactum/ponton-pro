<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПОНТОН ПРО - Понтоны и лодки</title>

    <meta name="description" content="Производство понтонов и лодок из ПНД. Надёжные решения для частного использования.">
    <link rel="icon" href="images/logo.jpg">
    <link rel="stylesheet" href="css/style.css?v=3">

</head>
<body>
    <!-- Шапка -->
    <header class="header">
        <div class="container header-container">
            <div class="header-logo">
                <img src="images/logo.jpg" alt="Логотип ПОНТОН ПРО">
            </div>
            <div class="header-title">
                <h1>ПОНТОН ПРО</h1>
                <p>Производство понтонов и лодок из ПНД</p>
            </div>
	    <div class="header-phone">
	        <a href="tel:+79378229760">+7 937 822-97-60</a><br>
	    </div>
        </div>
    </header>

    <!-- Приветственный экран -->
    <section class="hero">
        <div class="container hero-content">
            <div class="hero-text">
                <h2>Самые качественные понтоны и лодки</h2>
                <p>Прочные, долговечные и безопасные решения для воды</p>
            </div>
        </div>
    </section>

    <!-- Каталог продуктов -->
    <section id="products" class="products">
        <div class="container">
            <h2>Наша продукция</h2>
            <div id="productsList" class="products-list">
                <div class="loading">Загрузка продуктов...</div>
            </div>
        </div>
    </section>

    <!-- Модалка -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeOrderModal()">&times;</span>
            <h3>Оставить заявку</h3>
            <form id="orderForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>Ваше имя:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Телефон:</label>
                    <input type="tel" id="phone" required placeholder="+7 (999) 123-45-67">
                </div>
                <div class="form-group">
                    <label>Email (необязательно):</label>
                    <input type="email" id="email">
                </div>
                <div class="form-group">
                    <label>Комментарий:</label>
                    <textarea id="description" placeholder="Дополнительная информация..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Отправить заявку</button>
            </form>
        </div>
    </div>

    <!-- Уведомление -->
    <div id="notification" class="notification"></div>

    <!-- Футер -->
    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-left">
                <p>© 2026 "ПОНТОН ПРО". все права защищены.</p>
            </div>
            <div class="footer-right">
                <div class="footer-text">
			<p>Свяжитесь с нами: 
			<strong>
				<a href="tel:+79378229760">+7 937 822-97-60</a><br>
			</strong>
			</p>
                </div>
                <div class="social-icons">
                    <a href="mailto:dekon1980@gmail.com?subject=Запрос с сайта Понтон.про&body=Здравствуйте! Пишу с вашего сайта. Меня интересует..." 
                    target="_blank" rel="noopener noreferrer" class="social-btn telegram" title="Написать в Telegram">
                        <img src="images/telegram.svg" alt="Telegram">
                    </a>
                    <a href="tel:+79378229760" target="_blank" rel="noopener noreferrer" class="social-btn max" title="Написать в Max">
                        <img src="images/max.svg" alt="WhatsApp">
                    </a>
                    <a href="https://dekon1980@gmail.com" target="_blank" rel="noopener noreferrer" class="social-btn telegram" title="Написать на почту">
                        <img src="images/email.svg" alt="Email">
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
